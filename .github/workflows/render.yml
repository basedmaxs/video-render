name: render
on:
  workflow_dispatch:
    inputs:
      title: { description: "Output file title", default: "Jejak basah" }
      chunk: { description: "Frames per job", default: "100" }
      total: { description: "Frames to render (empty = whole story; e.g. 60 for a trial)", default: "" }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      total: ${{ steps.p.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q jejak-basah-project.zip
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: p
        run: node ci/plan.mjs "${{ inputs.chunk }}" "${{ inputs.total }}"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q jejak-basah-project.zip
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node build.mjs .
      - run: node render.mjs frames "${{ matrix.a }}-${{ matrix.b }}"
      - run: bash ci/encode_chunk.sh ${{ matrix.a }} ${{ matrix.b }} ${{ matrix.i }}
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: chunks/*.mp4
          retention-days: 1
          if-no-files-found: error
  stitch:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q jejak-basah-project.zip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - run: bash ci/stitch.sh "${{ inputs.title }}" "${{ needs.plan.outputs.total }}"
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/*
          retention-days: 7
