
name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Download project ZIP
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          unzip -o kuis-kereta-project.zip -d project
          cd project
          npm init -y
          npm install playwright

      - name: Install Chromium
        run: |
          cd project
          npx playwright install --with-deps chromium

      - name: Build and render
        run: |
          cd project
          node build.mjs .
          node render.mjs frames "0-2127"
          bash finish.sh "Tebak-tebakan di stasiun"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: project/**/*.mp4
          if-no-files-found: error
